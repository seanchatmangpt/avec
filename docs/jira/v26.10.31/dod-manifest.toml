# dod-manifest.toml — machine-checkable Definition of Done, milestone v26.10.31
# Specs: docs/jira/v26.10.31/31-verification-ladder.md (R8 machine report),
#        36-release-checklist.md, 65-coordinator-handoff.md (operator decisions)
# Checker: scripts/dod.sh (bash-native awk parser, audit-gate style)
#
# PARSER DISCIPLINE (line-oriented, like the branchless gate manifest reader;
# NOT a full TOML parser):
#   - single-line double-quoted values, one field per line
#   - no double quotes inside values (parser strips surrounding quotes)
#   - no tabs inside values; backslashes byte-exact (no escape decoding)
#
# expect semantics (fail-closed unless stated):
#   pass          exit 0 = PASS (green); ANY other exit incl. command-not-found
#                 = FAIL (red). No silent skips.
#   advisory      exit 0 = PASS; exit 2 = ADV-SKIP (yellow, non-failing; the
#                 perf_guard SKIP-NOISY contract); any other exit = FAIL red.
#   pending-holds exit 0 = PENDING (yellow, non-failing; the recorded operator
#                 decision has not landed); any other exit = STALE (red:
#                 reality moved, the manifest must be updated to retire the
#                 entry). A lane never flips a pending entry.
#
# Pending law: PENDING entries RECORD the operator decisions of
# 65-coordinator-handoff.md ("The Three Operator Decisions"). They are
# recorded, not adjudicated. When a decision lands, its check goes red STALE,
# which forces a manifest update: the entry retires into a court/receipt
# entry backed by its own receipt.

[meta]
milestone = "v26.10.31"
spec_ladder = "docs/jira/v26.10.31/31-verification-ladder.md"
spec_handoff = "docs/jira/v26.10.31/65-coordinator-handoff.md"
gate = "scripts/dod.sh"
updated = "wave-10 lane 1: manifest minted; 3 operator decisions recorded as PENDING, none flipped"

