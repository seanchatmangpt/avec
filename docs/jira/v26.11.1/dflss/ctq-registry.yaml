# ctq-registry
# Machine-readable conversion of the v26.11.1 DFLSS charter.
# Source of truth: docs/jira/v26.11.1/dflss/00-dflss-charter-source.md
#   - Section 3 (VOC -> CTQ flowdown table) -> rows ctq-01..ctq-06
#   - Section 4 Phase 5 (five terminal gates) -> GATE-1..GATE-5 below
# Standing law: every target carries standing TARGET (directional design
# nominal to be characterized in the Measure/Analyze phases). No entry in
# this registry is MEASURED. Graduation TARGET -> MEASURED happens only
# through the anti-vacuity Divan membrane (charter Section 4 Phase 2) and is
# recorded in a benchmark receipt; this file is never edited to claim a
# measurement.

meta:
  project: v26.11.1 Sovereign Compute Substrate
  methodology: DMADV
  charter_standing: CHARTERED / IN-FLIGHT
  source_of_truth: docs/jira/v26.11.1/dflss/00-dflss-charter-source.md
  source_sections: [section-3-voc-ctq-table, section-4-phase-5-five-gates]
  generated: "2026-11-01"
  canonical_seed: "0xBF58_476D_1CE4_E5B9"
  # canonical_seed is the SplitMix64 multiplier pinned by charter Sections 2
  # and 4 Phase 2. Digit drift away from the canonical constant in any
  # artifact is the known corruption class -> REFUSED (charter Section 6).
  standing_vocabulary: [ALIVE, PARTIAL, BLOCKED, REFUSED, UNSUPPORTED, UNVERIFIED]
  instrument_status_semantics:
    LANDING: cited command verified to exist on disk this session (ls/test/run)
    PENDING-LAND: no runnable command on disk; planned_command is intent only

gates:
  - id: GATE-1
    name: Workspace Purity
    phase_ref: charter section 4, Phase 5, gate 1 of 5 (sequential)
  - id: GATE-2
    name: Binary/Symbol Purity
    phase_ref: charter section 4, Phase 5, gate 2 of 5 (sequential)
  - id: GATE-3
    name: 1M-Row Sovereign Ledger Proof
    phase_ref: charter section 4, Phase 5, gate 3 of 5 (sequential)
  - id: GATE-4
    name: 640-Bit Spoliation & Liability Metering
    phase_ref: charter section 4, Phase 5, gate 4 of 5 (sequential)
  - id: GATE-5
    name: Bare-Metal Silicon Fit
    phase_ref: charter section 4, Phase 5, gate 5 of 5 (sequential)

ctqs:
