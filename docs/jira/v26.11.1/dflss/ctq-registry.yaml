    voc: Wire-Speed Ingress Security
    requirement: Drop malformed frames at the DMA boundary without CPU stall
    metric: Frame admission latency & throughput
    lanes: [A04, A14]
    target: "~4.0 ns / frame target; flat p99 tail distribution"
    instrument:
      name: Divan per-iteration latency distribution over cgap_admit_frame
      planned_command: cargo bench -p bench --bench ctq01_admit_frame -- --color never
      pending_note: >-
        no bench target named ctq01_admit_frame exists on disk (crates/bench/
        benches/ contains only v26_10_31.rs; ls exit 0 this session); the FFI
        symbol exists at crates/cgap-ffi/src/sovereign.rs (grep exit 0) and
        the Divan substrate is landed at crates/bench (divan = "0.1.21")
    instrument_status: PENDING-LAND
    gate_ref: GATE-3
    gate_rationale: Gate-3 exercises the frame ingress path at ledger scale
    standing: TARGET

  - id: ctq-02
    voc: Garbage-Collection Immunity
    requirement: Execute hot-path analytics and decoding with zero memory churn
    metric: Dynamic heap allocations on hot path
    lanes: [A01, A02]
    target: "0 Bytes allocated on fast path"
