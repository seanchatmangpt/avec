[workspace]
# License: MIT (code) + P28-SIL v2.1.0 (execution) — see LICENSE.md / LICENSE-P28-SIL.md

resolver = "2"
members = [
    "crates/avec-arrow",
    "crates/avec-blake3",
    "crates/avec-parquet",
    "crates/avec-ffi",
    "crates/avec-beam",
    "crates/avec-gpu",
    "crates/avec-git",
    "crates/bench",
    "crates/audit",
    "crates/integration",
    "crates/cli",
]

[workspace.package]
version = "26.10.29"
edition = "2021"
license = "MIT"
repository = "https://github.com/seanchatmangpt/avec"
authors = ["Sean Chatman <info@chatmangpt.com>"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

[profile.audit]
inherits = "release"
lto = false
codegen-units = 16
strip = false
panic = "abort"
