[workspace]
# License: governed by LICENSE-P28-SIL.md (P28-SIL v2.1.0,
# urn:avec:license:p28-sil:v2.1.0-sovereign); see LICENSE.md. No SPDX
# expression — the instrument is identified by URN (§9).

resolver = "2"
members = [
    "crates/avec-arrow",
    "crates/avec-blake3",
    "crates/avec-parquet",
    "crates/avec-ffi",
    "crates/avec-beam",
    "crates/avec-gpu",
    "crates/avec-git",
    "crates/bench",
    "crates/audit",
    "crates/integration",
    "crates/cli",
]

[workspace.package]
version = "26.10.29"
edition = "2021"
repository = "https://github.com/seanchatmangpt/avec"
authors = ["Sean Chatman <info@chatmangpt.com>"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

[profile.audit]
inherits = "release"
lto = false
codegen-units = 16
strip = false
panic = "abort"
