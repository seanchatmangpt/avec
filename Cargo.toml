[workspace]
# License: governed by LICENSE-P28-SIL.md (P28-SIL v2.1.0,
# urn:avec:license:p28-sil:v2.1.0-sovereign); see LICENSE.md. No SPDX
# expression — the instrument is identified by URN (§9).

resolver = "2"
members = [
    "crates/cgap",
    "crates/cgap-arrow",
    "crates/cgap-blake3",
    "crates/cgap-parquet",
    "crates/cgap-ffi",
    "crates/cgap-beam",
    "crates/cgap-gpu",
    "crates/cgap-git",
    "crates/bench",
    "crates/audit",
    "crates/integration",
    "crates/cli",
    # v26.11.1 moonshot lanes (A01-A20) - coordinator-scaffolded so lanes
    # never edit this root manifest (same-checkout fan-out, disjoint
    # ownership). PROPOSED until lane courts land.
    "crates/cgap-core",
    "crates/cgap-storage",
    "crates/cgap-bont",
    "crates/cgap-bosym",
    "crates/cgap-bn3",
    "crates/cgap-gate",
    "crates/cgap-crypto",
    "crates/cgap-p28",
    "crates/cgap-court",
    "ontologies/fibo",
    "ontologies/cloud",
]


[workspace.package]
version = "26.10.29"
edition = "2021"
repository = "https://github.com/seanchatmangpt/cgap"
authors = ["Sean Chatman <info@chatmangpt.com>"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

[profile.audit]
inherits = "release"
lto = false
codegen-units = 16
strip = false
panic = "abort"
