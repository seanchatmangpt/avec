[package]
name = "avec-cli"
version = "26.10.29"
edition = "2021"
description = "Std-hosted CLI over the avec columnar kernels: version, mask line-rate bench, RLE encode comparison, 64-byte alignment probe."
license = "MIT"
repository = "https://github.com/seanchatmangpt/avec"
authors = ["Sean Chatman <info@chatmangpt.com>"]
publish = false

[dependencies]
# Zero-dep repo-local kernels. avec-parquet is required by `bench-parquet`:
# rle_encode / rle_encode_fast live in avec-parquet, not avec-arrow.
avec-arrow = { path = "../avec-arrow" }
avec-parquet = { path = "../avec-parquet" }
avec-git = { path = "../avec-git" }
avec-blake3 = { path = "../avec-blake3" }

# Profiles live at the workspace root (Cargo.toml [profile.release] is
# identical); non-root [profile] sections are ignored and warn.

