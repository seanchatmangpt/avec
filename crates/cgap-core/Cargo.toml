[lib]

# §3 zero-dependency rule, named exception: "#[cfg(test)]-gated use of the
# repo's existing in-tree adapters for cross-tier courts". cgap-blake3 is the
# lane-doc-named digest substrate (A04 §10, A17 §3); it supplies the real
# BLAKE3 to `oabi_digest`/`verify_payload` at court call sites only. The
# runtime library keeps E=0 externals (dev-dependencies never compile into
# the lib target).
[dev-dependencies]
cgap-blake3 = { path = "../cgap-blake3" }
# Wave 9 cross-lane integration: the A14 dam (cgap-gate penstock `ingress`)
# consumes real A04 frames in tests/cross_lane_gate_court.rs. Same §3 named
# exception as cgap-blake3 — dev-only, never compiled into the lib target;
# the runtime library stays E=0 externals.
cgap-gate = { path = "../cgap-gate" }

