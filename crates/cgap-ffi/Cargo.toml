[package]
name = "cgap-ffi"
version.workspace = true
edition.workspace = true
description = "C Data Interface cdylib membrane for cgap (Gate 3 wire-parity exports)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cgap-arrow = { path = "../cgap-arrow" }

[dev-dependencies]
# Same crate as the normal dependency; needed only by tests/ to reach the
# c_abi release callbacks and ForeignArray for lifecycle assertions.
cgap-arrow = { path = "../cgap-arrow" }
# Hot-path allocation courts (tests/alloc_courts.rs): linking cgap_audit into
# the test binary installs its CountingAlloc #[global_allocator] and exposes
# with_alloc_tracking for the zero-alloc assertions.
cgap-audit = { path = "../audit" }
# The stardf consumer court now lives with its subject: stardf WIP upstream
# (2026-10-31), and cgap must not carry any stardf dependency — cargo resolves
# every workspace member's dev-deps during `cargo publish`, so a stardf
# dev-dep here blocked packaging all four published crates. Moved to
# ggen-legacy/stardf/arrow crates/stardf-arrow-capi/tests/cgap_consumer_court.rs
# (path-dev-deps on cgap-ffi/cgap-audit from the stardf side).
