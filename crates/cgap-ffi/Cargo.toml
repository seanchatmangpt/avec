[package]
name = "cgap-ffi"
version.workspace = true
edition.workspace = true
description = "C Data Interface cdylib membrane for cgap (Gate 3 wire-parity exports)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cgap-arrow = { path = "../cgap-arrow" }

[dev-dependencies]
# Same crate as the normal dependency; needed only by tests/ to reach the
# c_abi release callbacks and ForeignArray for lifecycle assertions.
cgap-arrow = { path = "../cgap-arrow" }
# Hot-path allocation courts (tests/alloc_courts.rs): linking cgap_audit into
# the test binary installs its CountingAlloc #[global_allocator] and exposes
# with_alloc_tracking for the zero-alloc assertions.
cgap-audit = { path = "../audit" }
# W3 consumer court (tests/stardf_consumer_court.rs): the FINAL stardf capi as
# a foreign-consumer dev-dep (rlib link for courts 1-2; cdylib artifact for
# court 3's dlopen witness).
stardf-arrow-capi = { path = "../../../ggen-legacy/stardf/arrow/crates/stardf-arrow-capi" }
