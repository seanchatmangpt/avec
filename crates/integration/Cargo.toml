[package]
name = "cgap-integration"
version = "26.10.29"
edition = "2021"
description = "Cross-crate integration tests: C-ABI roundtrip, alignment law, format-code table, varlen/views roundtrips."
publish = false

[dependencies]
cgap-arrow = { path = "../cgap-arrow" }

[dev-dependencies]
cgap-arrow = { path = "../cgap-arrow" }
cgap-audit = { path = "../audit" }
cgap-blake3 = { path = "../cgap-blake3" }
# std: the scan module (mmap scanner + ScanError surface) is feature-gated.
cgap-parquet = { path = "../cgap-parquet", features = ["std"] }
cgap-git = { path = "../cgap-git" }
