[lib]

[dependencies]
# One BLAKE3 kernel, many bindings (no O(N^2) drift): the keyed digest
# engine in `src/chatman.rs` binds cgap-blake3's public `compress_scalar`
# + chunk/parent/root flags. cgap-blake3 itself exposes NO keyed API (its
# external-vector test says so loudly); the keyed mode lives here.
cgap-blake3 = { path = "../cgap-blake3" }

[dev-dependencies]
# Courts compute Merkle leaves/parents and cross-check digests against the
# real unkeyed kernel (Chicago: real collaborators, no mocks).
cgap-blake3 = { path = "../cgap-blake3" }
